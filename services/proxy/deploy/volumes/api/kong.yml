## Kong del backend de FinanVoz: recorte de supabase/supabase docker/volumes/api/kong.yml (octubre de 2026).
## Solo /auth/v1, /rest/v1, /storage/v1 y /functions/v1. Sin Studio, Realtime, GraphQL, pg-meta ni analytics: lo que
## no está aquí responde 404 de Kong. kong-entrypoint.sh sustituye las $VARIABLES antes de arrancar.
_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
      - key: $SUPABASE_SECRET_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

# prettier-ignore: las comillas dobles importan (kong-entrypoint.sh mete expresiones Lua con comillas simples).
# prettier-ignore
services:
  ## Auth abierto (enlaces de correo y llaves públicas)
  - name: auth-v1-open
    url: http://finanvoz-auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://finanvoz-auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://finanvoz-auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1-open-jwks
    url: http://finanvoz-auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths:
          - /auth/v1/.well-known/jwks.json
    plugins:
      - name: cors

  ## Auth con llave (anon o service_role)
  - name: auth-v1
    url: http://finanvoz-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Raíz OpenAPI de PostgREST: solo service_role
  - name: rest-v1-openapi
    url: http://finanvoz-rest:3000/
    routes:
      - name: rest-v1-openapi-root
        strip_path: true
        expression: 'http.path == "/rest/v1/"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## PostgREST (la RLS decide qué ve cada JWT)
  - name: rest-v1
    url: http://finanvoz-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage (sin key-auth: las URLs firmadas y la ruta pública de `plantillas` no llevan apikey)
  - name: storage-v1
    url: http://finanvoz-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth == nil or auth == "" or auth:find("^%s*$") then
                kong.service.request.clear_header("authorization")
              end

  ## Edge Functions (el enrutador `main` verifica el JWT salvo en FUNCIONES_SIN_JWT). Sin el plugin `cors`, como en
  ## Supabase Cloud: cada función responde su CORS (lista-espera solo permite CALCULADORA_ORIGEN).
  - name: functions-v1
    url: http://finanvoz-functions:9000/
    read_timeout: 160000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - "sb-api-key"
          add:
            headers:
              - "sb-api-key:$LUA_FUNCTIONS_EXPR"
      - name: post-function
        config:
          access:
            - |
              local v = kong.request.get_header("sb-api-key")
              if v == nil or v == "" or v:find("^%s*$") then
                kong.service.request.clear_header("sb-api-key")
              end
