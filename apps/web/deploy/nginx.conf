server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # Cada location incluye las cabeceras (un add_header propio cancela las heredadas del server).

  location = /index.html {
    include /etc/nginx/conf.d/cabeceras.inc;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Rutas del panel: todas las sirve la misma página (el ruteo es del navegador).
  location /admin {
    include /etc/nginx/conf.d/cabeceras.inc;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  # Archivos con hash en el nombre: caché de un año.
  location /assets/ {
    include /etc/nginx/conf.d/cabeceras.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /index.html;
}
