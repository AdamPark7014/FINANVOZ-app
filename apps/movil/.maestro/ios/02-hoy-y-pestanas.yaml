# Asistente (ruta hoy) y las pestañas en iPhone: la barra del día abre el desglose, donde viven la probabilidad (o
# su candado de Plus) y «¿Me alcanza?» (Ola 7); Escribir, R2 («Registrar con formulario») y cada pestaña, con Tú.
# Falla si un botón no lleva a ningún lado (cada toque espera la pantalla destino).
appId: com.finanvoz.app
name: iOS · 02 Hoy y pestañas
tags:
  - ios
  - recorrido
  - capturas
---
- runFlow: subflujos/onboarding-rapido.yaml
- takeScreenshot: hoy
# Desglose: la barra del día lo abre; ahí están la probabilidad (o su candado) y «¿Me alcanza?»
- tapOn:
    id: boton-desglose
- extendedWaitUntil:
    visible:
      id: desglose
    timeout: 5000
- takeScreenshot: hoy-desglose
# Candado de probabilidad → Plan (solo si la build es Gratis)
- runFlow:
    when:
      visible:
        id: candado-probabilidad
    commands:
      - tapOn:
          id: candado-probabilidad
      - extendedWaitUntil:
          visible:
            id: pantalla-plan
          timeout: 10000
      - takeScreenshot: plan-iphone
      - runFlow: subflujos/atras.yaml
      - extendedWaitUntil:
          visible:
            id: pantalla-hoy
          timeout: 10000
# ¿Me alcanza? → puerta de Plus o pantalla. Solo existe con tienda o Plus de prueba (PLAN-UX 1.4): la build del
# simulador no trae compras y el botón no se muestra.
- scrollUntilVisible:
    element:
      id: boton-me-alcanza
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: boton-me-alcanza
    commands:
      - tapOn:
          id: boton-me-alcanza
      - extendedWaitUntil:
          visible:
            id: '(puerta-plus|pantalla-me-alcanza)'
          timeout: 10000
      - takeScreenshot: me-alcanza
      - runFlow:
          when:
            visible:
              id: puerta-plus-conocer
          commands:
            - tapOn:
                id: puerta-plus-conocer
            - extendedWaitUntil:
                visible:
                  id: pantalla-plan
                timeout: 10000
            - runFlow: subflujos/atras.yaml
            - extendedWaitUntil:
                visible:
                  id: puerta-plus
                timeout: 10000
      - runFlow: subflujos/atras.yaml
      - extendedWaitUntil:
          visible:
            id: pantalla-hoy
          timeout: 10000
# El desglose se cierra con la misma barra
- tapOn:
    id: boton-desglose
- extendedWaitUntil:
    notVisible:
      id: desglose
    timeout: 5000
# Escribir y «Registrar con formulario»
- tapOn:
    id: boton-escribir
- extendedWaitUntil:
    visible:
      id: campo-registrar
    timeout: 5000
- takeScreenshot: hoy-escribir-con-teclado
- runFlow:
    file: subflujos/cerrar-teclado.yaml
    env: { ANCLA: hoy-fecha }
- takeScreenshot: hoy-escribir-sin-teclado
- tapOn:
    id: boton-formulario
- extendedWaitUntil:
    visible:
      id: pantalla-registrar
    timeout: 10000
- takeScreenshot: registrar
- tapOn:
    id: boton-cerrar-registrar
- extendedWaitUntil:
    visible:
      id: pantalla-hoy
    timeout: 10000
# Al cerrar R2 el campo de texto vuelve con el teclado abierto y tapa las pestañas: se cierra con el mismo botón
- runFlow:
    when:
      visible:
        id: campo-registrar
    commands:
      - tapOn:
          id: boton-escribir
      - waitForAnimationToEnd:
          timeout: 2000
# Pestañas
- tapOn:
    id: pestana-movimientos
- extendedWaitUntil:
    visible:
      id: pantalla-movimientos
    timeout: 10000
- takeScreenshot: movimientos-vacio
- tapOn:
    id: pestana-cuentas
- extendedWaitUntil:
    visible:
      id: pantalla-cuentas
    timeout: 10000
- takeScreenshot: cuentas
- tapOn:
    id: pestana-tu
- extendedWaitUntil:
    visible:
      id: ajustes
    timeout: 10000
- takeScreenshot: tu
- tapOn:
    id: pestana-hoy
- extendedWaitUntil:
    visible:
      id: pantalla-hoy
    timeout: 10000
