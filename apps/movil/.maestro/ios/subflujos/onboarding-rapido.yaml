# Recién instalada → Hoy por el camino corto: quincena de $13,000, efectivo $600, sin pagos fijos, colchón sugerido.
appId: com.finanvoz.app
name: Subflujo · onboarding rápido
---
- launchApp:
    clearState: true
    clearKeychain: true # la llave de SQLCipher vive en el llavero
    permissions:
      all: allow
      notifications: unset # en español el aviso dice «Permitir»: Maestro solo toca «Allow»
    arguments:
      AppleLanguages: '(es-MX)'
      AppleLocale: es_MX
- extendedWaitUntil:
    visible:
      id: onb-bienvenida
    timeout: 60000
- takeScreenshot: o1-bienvenida
- tapOn:
    id: onb-empezar
- extendedWaitUntil:
    visible:
      id: onb-consentimiento
    timeout: 10000
# En pantallas altas la casilla queda «visible» pero debajo del pie fijo: un desplazamiento más la saca de ahí.
- scrollUntilVisible:
    element:
      id: onb-casilla-datos
- scroll
- tapOn:
    id: onb-casilla-datos
- takeScreenshot: o2-consentimiento
- tapOn:
    id: onb-aceptar
- extendedWaitUntil:
    visible:
      id: onb-ingreso
    # El primer flujo de la corrida corre con el simulador en frío: el paso de ingreso tardó más de 10 s (03, 28-10).
    timeout: 30000
- tapOn:
    id: onb-frecuencia-quincena
- runFlow:
    file: escribir.yaml
    env: { ANCLA: onb-titulo-paso, CAMPO: onb-ingreso-monto, TEXTO: '13000' }
- runFlow:
    file: cerrar-teclado.yaml
    env: { ANCLA: onb-titulo-paso }
- takeScreenshot: o3-ingreso
# El teclado acaba de cerrarse: se espera a que termine la animación antes de tocar el pie.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: onb-ingreso-continuar
- extendedWaitUntil:
    visible:
      id: onb-cuentas
    timeout: 20000
- runFlow:
    file: escribir.yaml
    env: { ANCLA: onb-titulo-paso, CAMPO: onb-efectivo, TEXTO: '600' }
- runFlow:
    file: cerrar-teclado.yaml
    env: { ANCLA: onb-titulo-paso }
- takeScreenshot: o4-cuentas
# El teclado acaba de cerrarse: se espera a que termine la animación antes de tocar el pie.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: onb-cuentas-continuar
- extendedWaitUntil:
    visible:
      id: onb-pagos-fijos
    timeout: 20000
- takeScreenshot: o5-pagos-fijos
- tapOn:
    id: onb-pagos-continuar
# O6 solo existe mientras el iPhone no lo salte (Ola 3); en Android (capturas de tienda) es la captura: «Ahora no».
- extendedWaitUntil:
    visible:
      id: '(onb-captura-pronto|onb-captura-ahora-no|onb-colchon)'
    timeout: 10000
- runFlow:
    when:
      visible:
        id: onb-captura-pronto
    commands:
      - takeScreenshot: o6-captura-iphone
      - tapOn:
          id: onb-captura-continuar
- runFlow:
    when:
      visible:
        id: onb-captura-ahora-no
    commands:
      - takeScreenshot: o6-captura-android
      - tapOn:
          id: onb-captura-ahora-no
- extendedWaitUntil:
    visible:
      id: onb-colchon
    timeout: 10000
- takeScreenshot: o7-colchon
- tapOn:
    id: onb-ver-mi-dia
- extendedWaitUntil:
    visible:
      id: pantalla-hoy
    timeout: 15000
- runFlow:
    when:
      visible:
        id: boton-aviso-entendido
    commands:
      - tapOn:
          id: boton-aviso-entendido
# Lote «oscuro» de las capturas (`-e TEMA=oscuro`): la app es clara aunque el teléfono esté en oscuro (02 §16), así
# que se elige «Oscuro» en Ajustes. Sin TEMA (o con TEMA=claro) no cambia nada.
- runFlow:
    when:
      true: ${typeof TEMA !== 'undefined' && TEMA === 'oscuro'}
    file: tema-oscuro.yaml
