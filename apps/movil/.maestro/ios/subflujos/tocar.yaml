# Toca un elemento con el teclado cerrado para que nunca caiga sobre una tecla. Variables: ANCLA, ID.
appId: com.finanvoz.app
name: Subflujo · tocar sin teclado encima
---
- runFlow:
    file: cerrar-teclado.yaml
    env:
      ANCLA: ${ANCLA}
# Centrado: si el elemento queda al borde, el pie fijo («Continuar») lo tapa y el toque cae en el pie.
- scrollUntilVisible:
    element:
      id: ${ID}
    centerElement: true
    timeout: 30000
- tapOn:
    id: ${ID}
