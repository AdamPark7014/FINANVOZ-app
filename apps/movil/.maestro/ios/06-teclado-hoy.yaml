# Toca «Registrar» SIN cerrar el teclado, como lo haría Adam. Fallaba en la 1.0.0 (3) porque el toque caía en el
# teclado (arreglado en la Ola 1). Después fallaba porque, con el teclado arriba, la conversación se quedaba sin alto
# y «Registré…» no se veía: desde el 26-10 mandar lo escrito cierra el campo (BarraVoz). Ya no es fallo conocido.
appId: com.finanvoz.app
name: iOS · 06 Teclado no tapa «Registrar» en Hoy
tags:
  - ios
---
- runFlow: subflujos/onboarding-rapido.yaml
- tapOn:
    id: boton-escribir
- extendedWaitUntil:
    visible:
      id: campo-registrar
    timeout: 5000
- runFlow: subflujos/intro-teclado.yaml
- inputText: 'coca 25 en efectivo'
- takeScreenshot: hoy-teclado-abierto
- tapOn:
    id: boton-enviar-registro
- extendedWaitUntil:
    visible:
      id: aviso
    timeout: 10000
- assertNotVisible:
    id: campo-registrar
