# CA-M2-02 en iPhone: «coca 25 en efectivo» por texto, movimiento, saldo $575, arqueo exacto y «Deshacer».
appId: com.finanvoz.app
name: iOS · 05 Registrar por texto y arqueo
tags:
  - ios
  - recorrido
---
- runFlow: subflujos/onboarding-rapido.yaml
# Se escribe y se manda con «Enviar» del teclado, como en el flujo 09 (tocar la fecha para cerrar el teclado dejaba
# el campo vacío desde que el orbe es lo principal, b6fecc7)
- runFlow: { file: subflujos/decir-por-texto.yaml, env: { FRASE: 'coca 25 en efectivo' } }
- extendedWaitUntil:
    visible:
      id: aviso
    timeout: 10000
- takeScreenshot: hoy-registrado
# Movimientos: la fila abre su detalle
- tapOn:
    id: pestana-movimientos
- extendedWaitUntil:
    visible:
      id: 'movimiento-fila-.*'
    timeout: 10000
- takeScreenshot: movimientos
- tapOn:
    id: 'movimiento-fila-.*'
- extendedWaitUntil:
    visible:
      id: 'detalle-.*'
    timeout: 5000
- takeScreenshot: movimiento-detalle
# Cuentas: $600 − $25 = $575 (VoiceOver lo lee en palabras)
- tapOn:
    id: pestana-cuentas
- extendedWaitUntil:
    visible:
      id: seccion-tienes
    timeout: 10000
- assertVisible:
    id: 'cuenta-.*-saldo'
    text: '.*(\$575|quinientos setenta y cinco pesos).*'
- takeScreenshot: cuentas-575
