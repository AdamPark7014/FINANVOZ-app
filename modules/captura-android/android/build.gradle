plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.finanvoz'
version = '0.1.0'

android {
  namespace "com.finanvoz.captura"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // Las fuentes de src/debug (Variante.DEPURACION = true, catálogo sintético para adb) solo
  // entran al build de depuración; src/release define DEPURACION = false y no trae catálogo extra.
}
