name: APK Android

# Construye un APK instalable para probar en el teléfono (firmado con la llave de depuración de Expo;
# no sirve para Play). Las llaves de proveedores nunca entran aquí: el modo nube queda apagado.
on:
  workflow_dispatch:
  push:
    branches: [build/apk-android]
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Proyecto nativo (expo prebuild)
        working-directory: apps/movil
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Compilar APK de release
        working-directory: apps/movil/android
        env:
          NODE_ENV: production
          # Sin cuenta de Sentry todavía (pendiente de Adam): no se suben source maps.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: finanvoz-apk
          path: apps/movil/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
