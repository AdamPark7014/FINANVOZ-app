name: Publicar calculadora

# Publica apps/calculadora (calculadora, aviso de privacidad y soporte). Manual a propósito.
#
# - `destino: github-pages` (por omisión): GitHub Pages del repositorio público,
#   https://adampark7014.github.io/FINANVOZ-app/ — la URL provisional que llevan las fichas de las tiendas
#   (aviso-de-privacidad.html y soporte.html) mientras finanvoz.com no exista. No exige la lista de espera.
# - `destino: cloudflare`: Cloudflare Pages (finanvoz.com). Exige la lista de espera y el responsable
#   (verificar-publicacion falla sin las variables) y los secretos CLOUDFLARE_* del entorno `produccion`.
on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Dónde publicar'
        type: choice
        options: [github-pages, cloudflare]
        default: github-pages

permissions:
  contents: read

concurrency:
  group: publicar-calculadora
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      DESTINO: ${{ inputs.destino || 'github-pages' }}
      VITE_LISTA_ESPERA_URL: ${{ vars.VITE_LISTA_ESPERA_URL }}
      VITE_RESPONSABLE_NOMBRE: ${{ vars.VITE_RESPONSABLE_NOMBRE }}
      VITE_RESPONSABLE_DOMICILIO: ${{ vars.VITE_RESPONSABLE_DOMICILIO }}
      VITE_RESPONSABLE_CORREO: ${{ vars.VITE_RESPONSABLE_CORREO }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar lo que se publica
        run: |
          if [ "$DESTINO" = cloudflare ]; then
            pnpm --filter @cartera/calculadora verificar-publicacion
          else
            pnpm --filter @cartera/calculadora verificar-publicacion --sin-lista-espera
          fi
      - name: Construir
        # En GitHub Pages el sitio vive bajo /FINANVOZ-app/: Vite reescribe los enlaces con ese prefijo. (Sin «--»:
        # pnpm 10 lo pasaría literal y Vite ignoraría --base.)
        run: |
          if [ "$DESTINO" = cloudflare ]; then
            pnpm --filter @cartera/calculadora build
          else
            pnpm --filter @cartera/calculadora build --base=/FINANVOZ-app/
          fi
          grep -q '/FINANVOZ-app/assets/' apps/calculadora/dist/soporte.html || { echo "::error::Vite no aplicó --base"; exit 1; }
          test -f apps/calculadora/dist/aviso-de-privacidad.html
          test -f apps/calculadora/dist/soporte.html
      - name: Artefacto para GitHub Pages
        if: env.DESTINO == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/calculadora/dist
      - name: Artefacto para Cloudflare
        if: env.DESTINO == 'cloudflare'
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-dist
          path: apps/calculadora/dist
          retention-days: 7

  github-pages:
    needs: construir
    if: ${{ (inputs.destino || 'github-pages') == 'github-pages' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
      - name: Las páginas de las tiendas responden
        env:
          BASE: ${{ steps.publicar.outputs.page_url }}
        run: |
          set -euo pipefail
          for p in aviso-de-privacidad.html soporte.html ''; do
            url="${BASE%/}/$p"
            for intento in 1 2 3 4 5 6; do
              codigo="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
              [ "$codigo" = 200 ] && break
              sleep 10
            done
            echo "$codigo $url"
            [ "$codigo" = 200 ]
          done

  cloudflare:
    needs: construir
    if: ${{ inputs.destino == 'cloudflare' }}
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calculadora-dist
          path: dist
      - name: Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=finanvoz --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
