name: Publicar calculadora

# Despliega apps/calculadora en Cloudflare Pages. Manual a propósito: no publica mientras el aviso de
# privacidad no identifique al responsable (verificar-publicacion falla sin las variables).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: produccion
    env:
      VITE_LISTA_ESPERA_URL: ${{ vars.VITE_LISTA_ESPERA_URL }}
      VITE_RESPONSABLE_NOMBRE: ${{ vars.VITE_RESPONSABLE_NOMBRE }}
      VITE_RESPONSABLE_DOMICILIO: ${{ vars.VITE_RESPONSABLE_DOMICILIO }}
      VITE_RESPONSABLE_CORREO: ${{ vars.VITE_RESPONSABLE_CORREO }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cartera/calculadora verificar-publicacion
      - run: pnpm --filter @cartera/calculadora build
      - name: Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy apps/calculadora/dist --project-name=alcanzi --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
