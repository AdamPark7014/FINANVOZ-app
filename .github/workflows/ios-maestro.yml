name: iOS · Maestro

# Pruebas de interfaz con Maestro en un simulador de iPhone sobre el mismo Finanvoz.app (Release, sin firma) que
# compila «iOS simulador» (ios.yml): no compila, baja su artefacto. Sube capturas, JUnit y registros. Sin secretos.
# Así los botones que no llevan a ningún lado en iPhone se ven aquí antes de que Adam los encuentre (plan de mejora,
# Ola 5). Flujos en apps/movil/.maestro/ios (los de la raíz de .maestro son los de Android).
on:
  workflow_run:
    workflows: ['iOS simulador']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/movil/.maestro/**'
      - '.github/workflows/ios-maestro.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Corrida de «iOS simulador» cuyo .app se prueba (vacío = la última verde de main)'
        required: false
        default: ''
      etiquetas:
        description: 'Etiquetas de Maestro a incluir (coma)'
        required: false
        default: 'ios'
      conocidos:
        description: 'Correr también los fallos conocidos y la voz (no bloquean)'
        type: boolean
        default: true
      oscuro:
        description: 'Repetir las capturas en modo oscuro'
        type: boolean
        default: false

concurrency:
  group: ios-maestro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # bajar el artefacto de otra corrida y listar corridas

jobs:
  maestro:
    name: Maestro en simulador de iPhone
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APP_ID: com.finanvoz.app
      MAESTRO_VERSION: '2.11.0'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      FLUJOS: ${{ github.workspace }}/apps/movil/.maestro
      SALIDA: ${{ github.workspace }}/maestro-salida
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Elegir el .app a probar
        id: origen
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENTO: ${{ github.event.workflow_run.id }}
          RUN_PEDIDO: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN="${RUN_EVENTO:-${RUN_PEDIDO:-}}"
          if [ -z "$RUN" ]; then
            RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios.yml --branch main --status success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          [ -n "$RUN" ] || { echo "::error::No hay corrida verde de «iOS simulador» en main: córrela primero."; exit 1; }
          echo "Pruebo el .app de https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN"
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"

      - name: Bajar Finanvoz.app
        uses: actions/download-artifact@v4
        with:
          name: finanvoz-ios-simulador
          run-id: ${{ steps.origen.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/app

      - name: Descomprimir y revisar el .app
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/app"
          ditto -x -k finanvoz-ios-simulador.zip .
          APP="$RUNNER_TEMP/app/Finanvoz.app"
          PL="$APP/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")" = "$APP_ID" ]
          echo "Versión $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL"))"
          echo "Arquitecturas: $(lipo -archs "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")")"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Xcode estable más nueva de la imagen
        run: |
          set -euo pipefail
          for X in $(ls -d /Applications/Xcode_*.app | sort -V -r); do
            case "$X" in *[Bb]eta*) continue ;; esac
            sudo xcode-select -s "$X"; break
          done
          xcodebuild -version
          xcrun simctl list runtimes available

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Hora de México (el simulador usa la del Mac)
        run: sudo systemsetup -settimezone America/Mexico_City

      - name: Crear un iPhone en español y arrancarlo
        run: |
          set -euo pipefail
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          RUNTIMES="$(xcrun simctl list runtimes available -j)"
          RUNTIME="$(jq -r '[.runtimes[] | select(.platform == "iOS")]
                            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty' <<<"$RUNTIMES")"
          TIPO="$(jq -r --arg r "$RUNTIME" '
                   [.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes[]] as $t
                   | ([$t[] | select(.name == "iPhone 17")] + [$t[] | select(.name == "iPhone 16")]
                      + [$t[] | select(.productFamily == "iPhone")]) | first | .identifier // empty' <<<"$RUNTIMES")"
          [ -n "$RUNTIME" ] && [ -n "$TIPO" ] || { echo "::error::No encontré runtime o modelo de iPhone"; exit 1; }
          echo "Runtime $RUNTIME · modelo $TIPO"
          UDID="$(xcrun simctl create "Finanvoz CI" "$TIPO" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          # Idioma y región del sistema: los avisos de permisos y el teclado salen en español.
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array es-MX es
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string es_MX
          # Mejor esfuerzo: sin autocorrección ni sugerencias.
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences KeyboardAutocorrection -bool false || true
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences KeyboardPrediction -bool false || true
          # El idioma se aplica al reiniciar.
          xcrun simctl shutdown "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults read -g AppleLanguages
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance light

      - name: Instalar la app y conceder el micrófono
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl get_app_container "$UDID" "$APP_ID" app
          # simctl privacy no tiene notificaciones, cámara ni reconocimiento de voz: esos los fija Maestro en cada
          # launchApp (permissions) o se aceptan en el aviso del sistema dentro del flujo.
          xcrun simctl privacy "$UDID" grant microphone "$APP_ID"
          mkdir -p "$SALIDA"

      - name: Flujos de iPhone (bloquean)
        env:
          ETIQUETAS: ${{ inputs.etiquetas || 'ios' }}
        run: |
          set -o pipefail
          cd "$SALIDA"
          maestro --device "$UDID" test \
            --include-tags "$ETIQUETAS" --exclude-tags "bug-conocido,voz" \
            --format junit --output "$SALIDA/junit-ios.xml" \
            --test-output-dir "$SALIDA/ios" --debug-output "$SALIDA/ios-log" \
            "$FLUJOS/ios" 2>&1 | tee "$SALIDA/maestro-ios.log"

      - name: Fallos conocidos y voz (no bloquean)
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.conocidos) }}
        continue-on-error: true
        run: |
          set -o pipefail
          cd "$SALIDA"
          maestro --device "$UDID" test --include-tags "bug-conocido,voz" \
            --format junit --output "$SALIDA/junit-conocidos.xml" \
            --test-output-dir "$SALIDA/conocidos" --debug-output "$SALIDA/conocidos-log" \
            "$FLUJOS/ios" 2>&1 | tee "$SALIDA/maestro-conocidos.log"

      - name: Capturas en modo oscuro (no bloquean)
        if: ${{ !cancelled() && inputs.oscuro }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun simctl ui "$UDID" appearance dark
          cd "$SALIDA"
          maestro --device "$UDID" test --include-tags capturas \
            --format junit --output "$SALIDA/junit-oscuro.xml" \
            --test-output-dir "$SALIDA/oscuro" --debug-output "$SALIDA/oscuro-log" \
            "$FLUJOS/ios" 2>&1 | tee "$SALIDA/maestro-oscuro.log"
          xcrun simctl ui "$UDID" appearance light

      - name: Reportes de fallo y registro de la app
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$SALIDA/sistema"
          cp ~/Library/Logs/DiagnosticReports/Finanvoz* "$SALIDA/sistema/" 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 90m --style compact \
            --predicate 'process == "Finanvoz"' > "$SALIDA/sistema/finanvoz.log" 2>/dev/null || true

      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          salida = os.environ["SALIDA"]
          lineas = ["## Maestro en simulador de iPhone", "", "| Grupo | Flujo | Resultado | Segundos |", "|---|---|---|---|"]
          for f in sorted(glob.glob(os.path.join(salida, "junit-*.xml"))):
              grupo = os.path.basename(f)[len("junit-"):-len(".xml")]
              for caso in ET.parse(f).getroot().iter("testcase"):
                  fallo = caso.find("failure") is not None or caso.find("error") is not None
                  lineas.append(f"| {grupo} | {caso.get('name')} | {'falló' if fallo else 'pasó'} | {caso.get('time', '')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("\n".join(lineas) + "\n")
          PY

      - name: Subir capturas, JUnit y registros
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-${{ github.run_number }}
          path: maestro-salida
          retention-days: 14
          if-no-files-found: warn
